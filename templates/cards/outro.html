<link rel="stylesheet" href="_base.css"><style>
html,body{width:{{w}}px;height:{{h}}px;background:var(--paper)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;padding:80px}
.rule{width:120px;height:1px;background:var(--ink);margin:0}
.logo{width:180px;height:180px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--paper-2)}
.logo img{width:120px;height:120px;border-radius:24px} .logo span{font:500 90px "Playfair Display",serif}
.head{font-size:{{headsize}}px;font-weight:500;letter-spacing:.04em;line-height:1.25;max-width:88%} .head em{font-style:italic;color:var(--accent)}
.cta{font:500 20px/1 "Inter",sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.handle{font:400 22px "Inter",sans-serif;color:var(--accent);letter-spacing:.06em}
</style><div class="wrap"><div class="logo">{{#if logo}}<img src="{{logo}}">{{else}}<span>{{initial}}</span>{{/if}}</div><div class="rule"></div><div class="head">{{headline}}</div><div class="cta">{{cta}}</div><div class="handle">{{handle}}</div></div>
