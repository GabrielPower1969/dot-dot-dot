<link rel="stylesheet" href="_base.css"><style>
html,body{width:{{w}}px;height:{{h}}px;background:var(--ink)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:var(--paper);text-align:center;padding:60px}
.logo{width:220px;height:220px;border-radius:50%;background:var(--y);border:10px solid var(--paper);display:flex;align-items:center;justify-content:center;font:700 120px "Arimo",sans-serif;color:var(--ink);box-shadow:14px 14px 0 var(--red)}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.head{font-size:{{headsize}}px;font-weight:700;line-height:1.2;max-width:90%}
.cta{font-size:44px;background:var(--y);color:var(--ink);border:8px solid var(--paper);border-radius:20px;padding:10px 40px;font-weight:700;box-shadow:10px 10px 0 var(--red)}
.handle{font-size:36px;opacity:.75;font-family:"Arimo",sans-serif}
</style><div class="wrap"><div class="logo">{{#if logo}}<img src="{{logo}}">{{else}}{{initial}}{{/if}}</div><div class="head">{{headline}}</div><div class="cta">{{cta}}</div><div class="handle">{{handle}}</div></div>
